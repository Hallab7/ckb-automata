[workspace]
members = [
  "contracts/job-lock",
  "contracts/deadline-policy",
  "contracts/recurring-policy",
  "contracts/demo-campaign-type",
  "contracts/campaign-lock",
  "contracts/harvest-vault-lock",
  "contracts/dao-harvest-policy",
  "contracts/job-lock-v2",
  "contracts/job-lock-v3",
  "contracts/dao-harvest-job-lock-v3",
  "contracts/deadline-policy-v2",
  "contracts/recurring-policy-v2",
  "contracts/dao-harvest-policy-v2",
  "contracts/harvest-vault-lock-v2",
  "contracts/compensation-lock-v2",
  "contracts/dao-harvest-policy-v3",
  "contracts/harvest-vault-lock-v3",
  "contracts/compensation-lock-v3",
  "contracts/tests",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.93.1"

[workspace.dependencies]
ckb-std = { version = "=1.1.0", default-features = false, features = ["allocator", "ckb-types"] }
ckb-testtool = "=1.1.1"
ckb-hash = { version = "=1.1.0", default-features = false, features = ["ckb-contract"] }
ckb-system-scripts = "=0.5.4"
ckb-dao-utils = "=1.1.0"
molecule = { version = "=0.9.2", default-features = false, features = ["bytes_vec"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
