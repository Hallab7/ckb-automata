[workspace]
members = [
  "contracts/job-lock",
  "contracts/deadline-policy",
  "contracts/recurring-policy",
  "contracts/demo-campaign-type",
  "contracts/tests",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.93.1"

[workspace.dependencies]
molecule = { version = "=0.9.2", default-features = false, features = ["bytes_vec"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
