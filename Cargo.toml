[workspace]
members = [
  "contracts/job-lock",
  "contracts/deadline-policy",
  "contracts/recurring-policy",
  "contracts/demo-campaign-type",
  "contracts/tests",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.93.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
