name: Foundation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: install
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Validate version pins
        run: npm exec --yes --package=pnpm@12.5.1 -- pnpm check:versions
      - name: Validate workspace links
        run: npm exec --yes --package=pnpm@12.5.1 -- pnpm check:workspace
      - name: Generate and check OpenAPI client
        run: npm exec --yes --package=pnpm@12.5.1 -- pnpm openapi:check

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Set up workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Run linters
        run: npm exec --yes --package=pnpm@12.5.1 -- pnpm lint
      - name: Check formatting
        run: npm exec --yes --package=pnpm@12.5.1 -- pnpm format:check
      - name: Check repository secrets
        run: npm exec --yes --package=pnpm@12.5.1 -- pnpm secrets:check
      - name: Check pushed commit subject
        if: github.event_name == 'push'
        run: npm exec --yes --package=pnpm@12.5.1 -- pnpm commit:check
      - name: Check pull request commit subjects
        if: github.event_name == 'pull_request'
        run: npm exec --yes --package=pnpm@12.5.1 -- pnpm commit:check --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Check TypeScript
        run: npm exec --yes --package=pnpm@12.5.1 -- pnpm typecheck

  unit-test:
    name: unit-test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Run unit tests
        run: npm exec --yes --package=pnpm@12.5.1 -- pnpm test

  backend-integration:
    name: backend-integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.0-bookworm@sha256:3f55f8895c4ed50603e2fbdfc72fffeeaba3173321fee5cb825bbbeb30d9d854
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: automata
          POSTGRES_USER: automata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username automata --dbname postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.2.1-bookworm@sha256:5fa2edb1e408fa8235e6db8fab01d1afaaae96c9403ba67b70feceb8661e8621
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Run composed backend tests
        env:
          AUTOMATA_INTEGRATION_DATABASE_URL: postgresql://automata:automata@127.0.0.1:5432/postgres
          AUTOMATA_INTEGRATION_REDIS_URL: redis://127.0.0.1:6379
        run: |
          npm exec --yes --package=pnpm@12.5.1 -- pnpm --filter @ckb-automata/api test:integration
          npm exec --yes --package=pnpm@12.5.1 -- pnpm --filter @ckb-automata/executor test:integration

  contract-build:
    name: contract-build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Install Molecule compiler
        run: cargo install moleculec --version 0.9.2 --locked
      - name: Check generated schemas
        run: npm exec --yes --package=pnpm@12.5.1 -- pnpm schema:check
      - name: Build contracts
        run: npm exec --yes --package=pnpm@12.5.1 -- pnpm contracts:build
      - name: Verify reproducible binaries
        run: npm exec --yes --package=pnpm@12.5.1 -- pnpm contracts:check-reproducible
      - name: Upload contract binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contract-binaries-${{ github.sha }}
          path: target/contract-artifacts
          if-no-files-found: error
          retention-days: 14

  contract-test:
    name: contract-test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Run contract tests
        run: npm exec --yes --package=pnpm@12.5.1 -- pnpm contracts:test

  contract-fuzz-smoke:
    name: contract-fuzz-smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up workspace
        uses: ./.github/actions/setup-node-workspace
      - name: Install pinned nightly and fuzz runner
        run: |
          rustup toolchain install nightly-2026-09-01 --profile minimal
          cargo +nightly-2026-09-01 install cargo-fuzz --version 0.13.2 --locked
      - name: Run bounded fuzz smoke tests
        run: npm exec --yes --package=pnpm@12.5.1 -- pnpm contracts:fuzz:smoke
