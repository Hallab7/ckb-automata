name: Public Runtime

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-runtime
  cancel-in-progress: true

jobs:
  readiness:
    name: readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          check-latest: false
          package-manager-cache: false
      - name: Check public runtime
        env:
          PUBLIC_API_URL: https://ckb-automata-api.onrender.com/
          EXECUTOR_A_URL: https://ckb-automata-executor-a.onrender.com/
          EXECUTOR_B_URL: https://ckb-automata-executor-b.onrender.com/
          PUBLIC_RUNTIME_EVIDENCE_PATH: public-runtime-evidence.json
        run: node scripts/verify-public-runtime.mjs
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-runtime-failure-${{ github.run_id }}
          path: public-runtime-evidence.json
          if-no-files-found: warn
          retention-days: 14
