name: Set up Rust workspace
description: Install the pinned Rust components and cache Cargo build output

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      shell: bash
      run: rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt --target riscv64imac-unknown-none-elf

    - name: Verify Rust toolchain
      shell: bash
      run: |
        rustc --version
        cargo --version
        rustup target list --installed | grep '^riscv64imac-unknown-none-elf$'

    - name: Restore Cargo build cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: target
        key: cargo-${{ runner.os }}-1.93.1-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
        restore-keys: |
          cargo-${{ runner.os }}-1.93.1-
