name: ckb-automata-local

services:
  ckb:
    build:
      context: ../..
      dockerfile: deploy/docker/ckb-dev.Dockerfile
    ports:
      - 127.0.0.1:${CKB_RPC_PORT:-58114}:8114
    volumes:
      - ckb-data:/var/lib/ckb

  postgres:
    image: postgres:18.0-bookworm@sha256:3f55f8895c4ed50603e2fbdfc72fffeeaba3173321fee5cb825bbbeb30d9d854
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-automata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_USER: ${POSTGRES_USER:-automata}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-55432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8.2.1-bookworm@sha256:5fa2edb1e408fa8235e6db8fab01d1afaaae96c9403ba67b70feceb8661e8621
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    ports:
      - 127.0.0.1:${REDIS_PORT:-56379}:6379
    volumes:
      - redis-data:/data

volumes:
  ckb-data:
    name: ckb-automata-ckb-data-v1
  postgres-data:
    name: ckb-automata-postgres-data
  redis-data:
    name: ckb-automata-redis-data
